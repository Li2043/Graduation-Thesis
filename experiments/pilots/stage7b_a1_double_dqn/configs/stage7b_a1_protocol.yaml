  - 0
  - 10000
  - 25000
  - 50000
  - 75000
  - 100000
  - 150000
  - 200000
  - 250000
  - 300000

primary_stability_checkpoints:
  - 100000
  - 150000
  - 200000
  - 250000
  - 300000

evaluation_episodes_per_checkpoint: 16
validation_blocks: 8
assignments_per_block: 2

training_run_count: 40
expected_evaluation_episode_count: 6400
statistical_unit: paired_training_seed

early_stopping: false
best_checkpoint_selection: false

# Unchanged vs Stage 6 formal protocol
epsilon_start: 1.0
epsilon_end: 0.10
epsilon_decay_environment_steps: 50000
epsilon_after_decay: 0.10
evaluation_epsilon: 0.0
gamma: 0.995
learning_rate: 0.0005
batch_size: 64
replay_capacity_per_controller: 20000
replay_warmup_per_controller: 512
target_sync_interval_updates: 250
hidden_sizes: [64, 64]
observation_dimension: 27
action_count: 3
max_policy_steps: 400
policy_interval_seconds: 0.2
num_parallel_training_envs_per_run: 1
vectorized_training: false
device: cpu

algorithm_difference: >
  Vanilla uses max over target-network Q-values.
  Double uses online-network argmax for action selection and
  target-network Q for evaluation of the selected action.
  Action masks apply to both selection and evaluation.

competence_gate:
  status: provisional_pilot_competence_gate
  note: PROVISIONAL — NOT YET PREREGISTERED CONFIRMATORY GATE
  seeds_required_at_or_above_0_75: 16
  total_seeds: 20
  mean_success_minimum: 0.75
  collision_maximum: 0.05
  truncation_maximum: 0.15
  strict_swap_eligibility_minimum: 0.75

late_collapse:
  prior_checkpoint_success_minimum: 0.75
  final_checkpoint_success_maximum: 0.50
  prior_checkpoints:
    - 200000
    - 250000
  final_checkpoint: 300000

locks:
  reuse_stage6_environment_lock: true
  reuse_stage6_comfort_lock: true
  reuse_stage6_base_reward: true
  reuse_stage6_training_blocks: true
  reuse_stage6_validation_blocks: true

checkpoint_policy:
  store_in_git: false
  require_external_checkpoint_root: true
  full_resumable_required: true
