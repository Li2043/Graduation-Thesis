stage: stage7b_a1
name: Paired Vanilla DQN vs Double DQN Stability Pilot
analysis_status: exploratory_algorithm_pilot
experiment_version: "Experiment Version 2 algorithm pilot"
description: >
  Baseline-only paired-seed single-factor algorithm pilot comparing
  Vanilla Independent DQN vs Double Independent DQN under the unchanged
  Stage 6 environment, base reward, exploration, replay, and 300K budget.
  The only experimental factor is Bellman target action selection.

conditions:
  - vanilla_dqn
  - double_dqn

base_reward_version: unchanged_stage6_base_reward
reward_shaping_enabled: false
shaping_coefficient: 0.0
lambda: 0.0
allow_mean_pbrs: false
allow_min_pbrs: false
reward_condition: baseline

