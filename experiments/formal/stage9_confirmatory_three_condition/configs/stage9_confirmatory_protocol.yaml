stage: stage9_confirmatory
purpose: formal_three_condition_confirmatory_experiment_supersedes_e16
protocol_tag: stage9-confirmatory-v1
analysis_status: formal_confirmatory_no_pass_fail_gate
experiment_version: "Stage 9 formal three-condition confirmatory experiment"

description: >
  Formal baseline/mean_pbrs/min_pbrs confirmatory experiment, superseding
  Stage 6A (E16, 100K main result). E16's baseline never reliably passed a
  competence gate (35.0% success), had 0/10 swap-estimable blocks for
  mean_pbrs, used a single 100K training endpoint (no learning curve), and
  its dissertation text describing the PBRS lambda values as
  "RMS-magnitude calibrated" does not match the equal-coefficient values
  actually used. This stage re-runs the comparison at 400K/Double-DQN scale
  with the Stage 8 gate's methodology (full checkpoint schedule, rich/
  lightweight evaluator split, corrected Stage-6B-H1 utility accounting).
  baseline is REUSED VERBATIM from the Stage 8 gate (stage8-gate-protocol-v1,
  seeds 65021-65040, FAIL) -- not retrained. Only mean_pbrs and min_pbrs are
  newly trained here. Does not re-run a PASS/FAIL competence gate on
  baseline; instead restricts RQ1-RQ3 analysis to certified choice states,
  per Chapter 2 SS2.9's own stated design. See
  experiments/formal/stage9_confirmatory_three_condition/docs/
  STAGE9_CONFIRMATORY_PROTOCOL.md for the full frozen protocol.

algorithm: double_dqn
conditions: [baseline, mean_pbrs, min_pbrs]
trained_conditions: [mean_pbrs, min_pbrs]
baseline_reused_from_protocol_tag: stage8-gate-protocol-v1
base_reward_version: v2_active_time
active_time_cost_per_step: 0.0005
active_time_cost_per_second: 0.0025
policy_interval_seconds: 0.20

pbrs:
  lambda_mean: 0.2
  lambda_min: 0.2
  gamma: 0.995
  comparison_type: equal_coefficient
  magnitude_matched: false
  rms_matched: false
  # Equal-coefficient design reused verbatim from
  # stage5c0_h1_r1_100k_protocol's final_pbrs_parameters.yaml
  # (pbrs_parameters_final: true, pilot_comparative_outcomes_used_for_selection: false).
  # RMS-magnitude calibration was considered and rejected as new,
  # unvalidated scope -- see protocol doc SS2 for the full reasoning.

master_seeds:
  baseline:
    start: 65021
    end: 65040
    count: 20
    reused: true
  mean_pbrs:
    start: 66001
    end: 66020
    count: 20
    list: [66001, 66002, 66003, 66004, 66005, 66006, 66007, 66008, 66009, 66010,
           66011, 66012, 66013, 66014, 66015, 66016, 66017, 66018, 66019, 66020]
  min_pbrs:
    start: 67001
    end: 67020
    count: 20
    list: [67001, 67002, 67003, 67004, 67005, 67006, 67007, 67008, 67009, 67010,
           67011, 67012, 67013, 67014, 67015, 67016, 67017, 67018, 67019, 67020]

forbidden_seed_blocks:
  formal_stage6: [61001, 61002, 61003, 61004, 61005, 61006, 61007, 61008, 61009, 61010]
  stage7a1_baseline_budget: [62001, 62002, 62003, 62004, 62005, 62006, 62007, 62008, 62009, 62010,
                              62011, 62012, 62013, 62014, 62015, 62016, 62017, 62018, 62019, 62020]
  stage7b_a1_double_dqn: [63001, 63002, 63003, 63004, 63005, 63006, 63007, 63008, 63009, 63010,
                           63011, 63012, 63013, 63014, 63015, 63016, 63017, 63018, 63019, 63020]
  stage7c_q1_baseline_competence: [64001, 64002, 64003, 64004, 64005, 64006, 64007, 64008, 64009, 64010,
                                    64011, 64012, 64013, 64014, 64015, 64016, 64017, 64018, 64019, 64020]
  stage8_pilots_arm0_arm1_arm2a_arm2b: [65001, 65002, 65003, 65004, 65005, 65006, 65007, 65008,
                                          65009, 65010, 65011, 65012, 65013, 65014, 65015, 65016,
                                          65017, 65018, 65019, 65020]
  stage8_gate_baseline: [65021, 65022, 65023, 65024, 65025, 65026, 65027, 65028, 65029, 65030,
                          65031, 65032, 65033, 65034, 65035, 65036, 65037, 65038, 65039, 65040]

max_joint_environment_steps: 400000
timestep_definition: one_joint_environment_transition

checkpoints:
  - 0
  - 25000
  - 50000
  - 75000
  - 100000
  - 125000
  - 150000
  - 175000
  - 200000
  - 225000
  - 250000
  - 275000
  - 300000
  - 325000
  - 350000
  - 375000
  - 400000

learning_curve_checkpoints: [200000, 225000, 250000, 275000, 300000, 325000, 350000, 375000, 400000]
rich_log_checkpoints: [0, 350000, 375000, 400000]

evaluation:
  policy: greedy
  epsilon: 0.0
  seed_algorithm: sha256_stable
  early_checkpoints_max: 175000
  early_scenario_blocks: 8
  late_checkpoints_min: 200000
  late_scenario_blocks: 32
  assignments_per_block: 2
  standard_subset_blocks: [0, 1, 2, 3, 4, 5, 6, 7]
  baseline_evaluation_reused: true
  baseline_evaluation_source: results/stage8_gate/v1

interpretive_constraint: >
  No fresh baseline competence gate is re-run in this stage (already run
  and FAILed under stage8-gate-protocol-v1). RQ1-RQ3 convention analysis
  (q, p_MF, D_swap) and welfare comparison (U_mean, U_min) are computed only
  over certified choice states (thesis.certification.choice_state_scenarios),
  and the realized resolution proportion within that subset is reported as
  a primary descriptive quantity before any welfare number is interpreted,
  per Chapter 2 SS2.9's own stated design.

statistical_design:
  n_per_condition: 20
  rq1_rq2_framework: difference_detection_power
  rq1_rq2_alpha: 0.05
  rq1_rq2_power: 0.80
  rq1_rq2_mes_success_rate: 0.20
  rq1_rq2_mes_swap_eligibility: 0.20
  rq3_framework: non_inferiority_precision
  rq3_margin_collision_rate_abs: 0.03
  rq3_margin_mean_mobility_relative: 0.10
  rq3_margin_resolution_q_abs: 0.05
  rq3_mobility_baseline_anchor: 0.8968
  rq3_mobility_anchor_scope: learners_A_B_only_not_full_4_stakeholder
  rq3_mobility_anchor_source: computed_2026-08-03_from_stage8_gate_rich_trajectories

epsilon_start: 1.0
epsilon_end: 0.10
epsilon_decay_environment_steps: 50000
epsilon_after_decay: 0.10
evaluation_epsilon: 0.0
gamma: 0.995
learning_rate: 0.0005
learning_rate_end: 0.0001
learning_rate_decay_environment_steps: 400000
batch_size: 64
replay_capacity_per_controller: 20000
replay_warmup_per_controller: 512
target_sync_interval_updates: 250
target_update_mode: hard
hidden_sizes: [64, 64]
observation_dimension: 27
action_count: 3
max_policy_steps: 400
num_parallel_training_envs_per_run: 1
vectorized_training: false
device: cpu
early_stopping: false
best_checkpoint_selection: false

algorithm_difference: >
  Double DQN only, identical to the Stage 8 gate -- not varied across
  conditions in this stage. Only the reward differs (baseline / mean_pbrs /
  min_pbrs); Vanilla DQN forbidden.

locks:
  reuse_stage6_environment_lock: true
  reuse_stage6_comfort_lock: true
  reuse_stage6_training_blocks: true
  reuse_stage6_validation_blocks: true

checkpoint_policy:
  store_in_git: false
  require_external_checkpoint_root: true
  full_resumable_required: true
  github_transfers: [code, csv, json, manifests, reports, figures]

decision_rule: >
  No PASS/FAIL/INVALID trichotomy this stage (that is the Stage 8 gate's
  role, already resolved: FAIL). This stage produces a descriptive +
  inferential report: RQ1 convention pattern under baseline; RQ2 whether
  mean_pbrs/min_pbrs change safe resolution/order/identity-sensitivity
  relative to baseline; RQ3 whether min_pbrs improves the worst-off outcome
  without exceeding the frozen non-inferiority margins above. Integrity
  (data completeness) is still checked mechanically and yields a binary
  VALID/INVALID flag, separate from the substantive RQ1-RQ3 findings.

supersession_note: >
  This protocol supersedes Stage 6A/6B/6B-H1 (E16-E18) as the dissertation's
  primary three-condition comparison. E16 is retained in the dissertation
  as a formative/exploratory-stage result with its limitations documented
  (per PAPER_CHANGES_REQUIRED_LATER.md), not deleted -- matching how
  Stage 6B was already marked superseded by Stage 6B-H1 at smaller scale.
