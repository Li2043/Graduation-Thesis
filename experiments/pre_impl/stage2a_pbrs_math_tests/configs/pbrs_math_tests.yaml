# Stage-2A PBRS mathematical correctness tests
# lambda_mean / lambda_min are TEST-ONLY placeholders, not final experiment values.

experiment:
  name: stage2a_pbrs_math_tests
  stage: "2A"
  description: Pure-function PBRS / potential mathematics (no env, no DQN)

seed: 0

pbrs:
  learner_gamma: 0.995
  shaping_gamma: 0.995
  # TEST-ONLY placeholders (not calibrated)
  lambda_mean: 0.5  # TEST-ONLY
  lambda_min: 0.5   # TEST-ONLY
  gamma_match_tolerance: 1.0e-12

stakeholders:
  fixed_set: [A, B, B_front, B_rear]
  learning_controllers: [A, B]

telescoping:
  tolerance: 1.0e-12

pytest:
  test_path: tests/rewards/test_pbrs_v2.py
  extra_args: ["-q", "--tb=short"]
